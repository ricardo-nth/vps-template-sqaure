faqSection:
  heading: Complex Care Referral FAQs
  intro: Practical guidance for referral teams, case managers, and families.
  items:
    - question: How quickly can a complex care package start?
      answer: Start timing depends on clinical complexity and risk profile, but urgent referrals are triaged quickly with mobilisation milestones and clear ownership.
    - question: How do you coordinate with healthcare professionals?
      answer: We maintain structured communication with GPs, nursing teams, and specialists, with documented updates linked to care plan reviews.
    - question: Can support intensity change over time?
      answer: Yes. Packages are reviewed regularly and adjusted based on outcomes, clinical advice, and evolving personal goals.
    - question: How is quality monitored after onboarding?
      answer: We use supervision, audit cycles, incident learning, and formal review checkpoints to maintain safe, consistent delivery.
