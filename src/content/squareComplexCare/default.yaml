serviceFit:
  badgeLabel: Service Fit
  heading: Who This Complex Care Service Is Best For
  intro: This model is designed for referrals that need coordinated clinical oversight with person-centred daily support.
  suitableForTitle: Usually a Strong Fit For
  suitableFor:
    - Adults with higher support needs requiring coordinated multi-disciplinary input.
    - Families and professionals seeking stable staffing with clear escalation protocols.
    - Referrals that need measurable outcomes and governance-led review cycles.
  alternativeSupportTitle: Better Directed Elsewhere When
  alternativeSupport:
    - The primary requirement is short-term acute medical intervention.
    - The referral has no ongoing support coordination requirement after discharge.
    - Independent low-support domiciliary visits are sufficient without clinical oversight.
firstThirtyDays:
  heading: What the First 30 Days Looks Like
  intro: Mobilisation prioritises risk control, continuity, and early outcome visibility.
  milestones:
    - dayRange: Days 1-7
      title: Clinical and Risk Baseline
      description: Confirm health priorities, risk profile, and immediate safety controls with stakeholders.
      icon: tabler:heartbeat
    - dayRange: Days 8-14
      title: Team Alignment and Plan Activation
      description: Activate the care plan, confirm staffing continuity, and lock communication pathways.
      icon: tabler:users-group
    - dayRange: Days 15-30
      title: Outcome Review and Adjustment
      description: Review delivery quality, update interventions, and agree month-two priorities.
      icon: tabler:chart-line
