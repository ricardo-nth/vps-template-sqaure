serviceFit:
  badgeLabel: Service Fit
  heading: Who This Complex Home Care Service Is Best For
  intro: This service is strongest where clinical needs are higher but care is best delivered at home with coordinated oversight.
  suitableForTitle: Usually a Strong Fit For
  suitableFor:
    - Adults requiring medication, mobility, or complex routine support at home.
    - Families needing dependable communication and continuity-led home visits.
    - Discharge pathways where readmission risk needs close monitoring and structured review.
  alternativeSupportTitle: Better Directed Elsewhere When
  alternativeSupport:
    - Residential or inpatient settings are required as the safest primary environment.
    - There is no sustained home-care requirement after immediate post-discharge needs.
    - Clinical complexity is low and standard domiciliary visits are sufficient.
firstThirtyDays:
  heading: What the First 30 Days Looks Like
  intro: Implementation focuses on safe mobilisation, routine consistency, and measurable home-care outcomes.
  milestones:
    - dayRange: Days 1-7
      title: Home Clinical Baseline and Safety Setup
      description: Confirm medication protocols, risk controls, and emergency escalation contacts for the package.
      icon: tabler:home-heart
    - dayRange: Days 8-14
      title: Continuity Roster and Daily Routine Stabilisation
      description: Lock visit windows, assign core carers, and align communication routines with family and professionals.
      icon: tabler:calendar-check
    - dayRange: Days 15-30
      title: Quality Review and Plan Optimisation
      description: Review delivery reliability and outcomes, then refine visit structure and goals for month two.
      icon: tabler:chart-bar
