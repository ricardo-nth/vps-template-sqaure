whyChooseUs:
  eyebrow: Complex Home Care
  heading: Clinical expertise delivered at home
  intro: We bring specialist nursing coordination and person-centred support into the home, maintaining safety and dignity for clients with complex needs.
  id: quality
  points:
    - title: Nursing oversight
      description: Regular clinical reviews and nursing-led care coordination for complex medication and health needs.
      iconName: tabler:stethoscope
    - title: Reliable visit schedules
      description: Consistent carers and structured visit times for continuity and trust at home.
      iconName: tabler:clock-hour-4
    - title: Family coordination
      description: Clear communication with families, district nurses, and GP practices.
      iconName: tabler:users-group
    - title: Safety-first approach
      description: Risk assessments, emergency protocols, and robust medication management.
      iconName: tabler:shield-check
cqcJourney:
  badgeLabel: Quality Assurance
  heading: Home-based clinical quality
  subheading: Governance and oversight that ensures safe, compliant complex care delivered at home.
  steps:
    - title: Home Care Governance
      description: Policies and procedures specifically designed for complex care delivery in domestic settings.
      status: completed
      date: Completed Q2 2024
    - title: Clinical Competency Training
      description: Carer training verified for complex medication, PEG feeding, and catheter care.
      status: completed
      date: Completed Q3 2024
    - title: Multi-Agency Protocols
      description: Established communication pathways with district nurses, GPs, and hospital discharge teams.
      status: current
      date: In Progress
    - title: Outcome Tracking
      description: Regular quality audits and outcome measurement for continuous improvement.
      status: upcoming
