faqSection:
  heading: Complex Home Care Referral FAQs
  intro: Practical answers for discharge teams, case managers, and families.
  items:
    - question: Can complex home care start directly after discharge?
      answer: Yes, where clinical information and risk controls are in place. We coordinate mobilisation quickly with clear ownership and start-date visibility.
    - question: How do you manage medication and clinical tasks?
      answer: Care plans include documented medication protocols, competency-matched staffing, and escalation pathways for clinical concerns.
    - question: How is family communication handled?
      answer: Families receive structured updates at agreed intervals and immediate notifications where there are material care changes.
    - question: What happens if needs increase unexpectedly?
      answer: Packages are designed to flex. We can rapidly adjust visit intensity, rota structure, and coordination with clinical partners as needed.
